<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <!-- Geometric MCORP Mark -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal outer boundary -->
    <path d="M 50 5 L 90 27.5 L 90 72.5 L 50 95 L 10 72.5 L 10 27.5 Z" 
          stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.85" fill="none"/>
    <path d="M 50 12 L 83 31 L 83 69 L 50 88 L 17 69 L 17 31 Z" 
          stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" fill="none"/>
    <!-- Stylized Precision 'M' Structure -->
    <path d="M 28 68 L 28 32 L 50 54 L 72 32 L 72 68" 
          stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Central Core Node -->
    <circle cx="50" cy="54" r="3" fill="#ffffff" />
    <circle cx="50" cy="74" r="2" fill="#9ca3af" opacity="0.6"/>
  </g>

  <!-- Typography: MCORP COMPUTING -->
  <g transform="translate(130, 28)">
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="44" font-weight="800" letter-spacing="12" fill="#ffffff">MCORP</text>
    <text x="4" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="11" font-weight="600" letter-spacing="6.5" fill="#9ca3af" fill-opacity="0.8">COMPUTING SYSTEMS</text>
  </g>
</svg>
